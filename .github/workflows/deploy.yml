
name: Deploy .NET 10 MVC to MonsterASP.net

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish project
        shell: bash
        run: |
          PROJECT=$(find . -name "*.csproj" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "No .csproj file found."
            exit 1
          fi

          echo "Publishing: $PROJECT"
          dotnet publish "$PROJECT" -c Release -o ./publish

      - name: Validate FTP settings
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "FTP Secrets are missing or empty!"
            exit 1
          fi

          echo "FTP settings are configured."

      - name: Stop Server
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "<html><body><h1>Updating...</h1></body></html>" > app_offline.htm

          curl --fail --show-error --silent --ftp-pasv \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file app_offline.htm \
            "ftp://$FTP_SERVER/wwwroot/app_offline.htm"

      - name: Deploy App
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./publish/
          server-dir: /wwwroot/
          security: loose
          exclude: |
            **/app_offline.htm

      - name: Start Server
        if: always()
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "FTP settings missing. Cannot remove app_offline.htm."
            exit 0
          fi

          curl --fail --show-error --silent --ftp-pasv \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --quote "-DELE /wwwroot/app_offline.htm" \
            "ftp://$FTP_SERVER/" || true
